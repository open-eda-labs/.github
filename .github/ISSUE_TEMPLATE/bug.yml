name: Bug
description: Comportamento incorreto ou inesperado
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: observado
    attributes:
      label: O que aconteceu
      description: Comportamento observado. Não cole segredos nem dados D2/D3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: O que era esperado
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Como reproduzir
      description: Passos, comandos e versões envolvidas.
    validations:
      required: true
  - type: input
    id: decisoes
    attributes:
      label: Etapa e decisões relacionadas
      description: "Opcional. Exemplo: P2, D-31."
